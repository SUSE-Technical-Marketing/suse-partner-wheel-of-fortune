      options:
        - "Rebuild every AI blueprint to include backup"
        - "Install CloudCasa from the SUSE Rancher Prime extensions catalog and protect the blueprints as they are"
        - "Copy the GPU servers to tape"
      answer: "B"
    - question: "NVIDIA OpenShell + CloudCasa: What does NVIDIA OpenShell do, and what does CloudCasa add?"
      options:
        - "OpenShell runs AI agents in secure, policy-controlled sandboxes on Kubernetes; CloudCasa keeps those agent workloads and their data recoverable"
        - "OpenShell replaces Kubernetes; CloudCasa replaces the GPUs"
        - "OpenShell is a backup tool; CloudCasa is a chatbot"
