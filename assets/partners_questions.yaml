# Partner Wheel of Fortune – partners and quiz questions.
#
# Per partner:
#   name       Display name (also used for accessibility labels)
#   logo       Path relative to assets/ (see assets/logos/)
#   logo_tint  Optional. "dark" turns a white-on-transparent logo black so it is
#              visible on the white wheel badge.
#   questions  List (may be empty -> the app only offers "Reset").
#     question     The question text
#     options      Optional list of answer options (rendered as A, B, C, ...)
#     answer       With options: the letter of the correct option (e.g. "B").
#                  Without options: the answer text itself.
#     explanation  Optional text shown when the answer is revealed.

- name: "Traefik Labs"
  logo: logos/traefik.svg
  questions:
    - question: "AI Gateway: What does an AI gateway do for traffic going to large language models?"
      options:
        - "Train and fine-tune the models on your company data"
        - "Route LLM requests and apply guardrails like PII masking and prompt filtering"
        - "Replace the GPUs needed to run inference"
      answer: "B"
    - question: "Agent Governance: What does an MCP gateway control?"
      options:
        - "Which MCP servers and tools an AI agent is allowed to call"
        - "How much GPU memory each model can use"
        - "The training data a model was built on"
      answer: "A"
    - question: "Sovereign AI with SUSE: What does Traefik Hub add to SUSE AI Factory with NVIDIA?"
      options:
        - "The Kubernetes distribution the platform runs on"
        - "Backup and disaster recovery for AI workloads"
        - "Runtime governance for model and agent tool calls through its AI Gateway and MCP Gateway"
      answer: "C"

- name: "Vultr"
  logo: logos/vultr.svg
  # NOTE: the source sheet does not mark correct answers for Vultr; these were
