        - "Vultr's mascot"
        - "The engineer who built Vultr"
      answer: "B"
    - question: "What happens when SUSE AI Factory meets Vultr?"
      options:
        - "They open a factory that makes GPUs"
        - "They build an AI-powered coffee machine"
        - "They help enterprises deploy and manage AI workloads"
      answer: "C"
