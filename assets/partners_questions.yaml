- name: "Veeam Software"
  logo: logos/veeam.svg
  questions:
    - question: "SUSE Rancher: What does Veeam Kasten protect in a SUSE Rancher-managed Kubernetes environment?"
      answer: "Applications, Kubernetes configuration, and persistent data"
      explanation: "Veeam Kasten provides application-aware protection that captures the application, its metadata/configuration, and associated storage, enabling reliable backup, recovery, and mobility across Kubernetes environments."
    - question: "SUSE Virtualization: What is a key benefit of Veeam Kasten for SUSE Virtualization environments?"
      answer: "Unified protection for both virtual machines and containers using a single policy framework"
      explanation: "SUSE Virtualization runs KubeVirt-based VMs alongside Kubernetes workloads. Veeam Kasten protects both VMs and containers through a common, Kubernetes-native protection model."
    - question: "Open Source / No Vendor Lock-In: How do SUSE and Veeam Kasten help organizations avoid vendor lock-in?"
      answer: "By supporting open architectures, multiple clouds, diverse Kubernetes environments, and portable data recovery"
      explanation: "Choose the infrastructure, cloud, and storage that fit your business without changing your protection strategy."

