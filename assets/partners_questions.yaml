- name: "Tensormesh"
  logo: logos/tensormesh.png
  logo_tint: dark
  questions:
    - question: "In LLM inference, what does “KV” in “KV cache” stand for?"
      options:
        - "Key-Value"
        - "Kernel-Vector"
        - "Knowledge-Vault"
      answer: "A"
      explanation: "These are the attention keys and values a model computes for each token."
    - question: "Tensormesh’s founders created which open-source project for storing and reusing KV cache?"
      options:
        - "LangChain"
        - "LMCache"
        - "llama.cpp"
      answer: "B"
      explanation: "It’s used with inference engines like vLLM."
    - question: "What’s the main benefit of using the Tensormesh platform for KV cache?"
      options:
        - "It makes your model bigger"
        - "It improves your training data"
        - "It reuses work the model has already done, so you get faster responses and lower inference costs on fewer GPUs"
      answer: "C"
      explanation: "Tensormesh stores the KV cache and reuses it across requests, so GPUs don’t recompute tokens they’ve already processed."

- name: "Tigera"
  logo: logos/tigera.png
  questions:
    - question: "Why is it hard to spot an AI agent in a Kubernetes cluster?"
      options:
        - "To Kubernetes, an AI agent looks like any other pod"
        - "AI agents run outside the cluster"
        - "AI agents don’t get IP addresses"
        - "Kubernetes hides AI agents by default"
      answer: "A"
      explanation: "Nothing in the pod spec says “this is an AI agent.” You have to look at what it does."
    - question: "Why are shared API keys a problem for AI agents?"
      options:
        - "You can’t tell which AI agent used the key, and revoking it breaks everyone who shares it"
        - "They make LLM calls slower"
        - "Kubernetes can’t store them"
        - "They expire every minute"
      answer: "A"
      explanation: "Each AI agent needs its own identity, not a shared secret."
    - question: "You delete a misbehaving AI agent’s pod. What usually happens next?"
      options:
        - "Its Deployment recreates the pod"
        - "The AI agent is gone for good"
        - "The whole namespace is deleted"
        - "The node reboots"
      answer: "A"
      explanation: "Kubernetes keeps restoring the state you declared, so deleting a pod rarely stops anything."

